name: mohtavayab-dev

services:
  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mohtavayab}
      POSTGRES_USER: ${POSTGRES_USER:-mohtavayab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-in-local-env}
    ports: ['127.0.0.1:5432:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: ['data']
    restart: unless-stopped

  redis:
    image: redis:8.4.0-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports: ['127.0.0.1:6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: ['data']
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-mohtavayab-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-in-local-env}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes: ['minio-data:/data']
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 20
    networks: ['data']
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.29.1
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-mohtavayab}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-change-in-local-env}
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports: ['127.0.0.1:7233:7233']
    networks: ['workflow', 'data']
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.42.1
    depends_on: ['temporal']
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports: ['127.0.0.1:8233:8080']
    networks: ['workflow']
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.140.1
    command: ['--config=/etc/otelcol/config.yaml']
    volumes:
      - ../observability/otel-collector.dev.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - '127.0.0.1:4317:4317'
      - '127.0.0.1:4318:4318'
    networks: ['observability']
    restart: unless-stopped

networks:
  data: { internal: true }
  workflow: { internal: true }
  observability: { internal: true }

volumes:
  postgres-data:
  minio-data:
