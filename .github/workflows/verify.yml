name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v4
        with: { version: 12.18.0, run_install: false }
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.13.5
          enable-cache: true
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Python dependencies
        run: uv sync --all-packages --frozen
      - name: Validate roadmap and completed stages
        run: pnpm validate
      - name: Enforce architecture boundaries
        run: pnpm check:boundaries
      - name: Validate environment contracts
        run: pnpm check:environment
      - name: Lint, typecheck and test
        run: pnpm lint && pnpm typecheck && pnpm test
      - name: Build workspace
        run: pnpm build
      - name: Verify clean generated state
        run: git diff --exit-code
